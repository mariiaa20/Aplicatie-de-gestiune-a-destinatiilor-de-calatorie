<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Manager - Premium</title>
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <h1>Travel Destinations</h1>
      <p>Manage and organize your next adventures.</p>
      <p class="app-count">3 destinations, 2 planned</p>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Add destination</h2>
      <form class="item-form">
        <label>Destination 
          <input type="text" name="title" placeholder="e.g., Rome, Italy" />
        </label>
        
        <label>Location type
          <select name="tag">
            <option value="city-break">City Break</option>
            <option value="beach">Beach</option>
            <option value="mountain">Mountain</option>
          </select>
        </label>
        
        <button type="submit">Add to list</button>
      </form>
    </section>

    <section class="panel">
      <h2>My travel list</h2>
      <ul class="item-list">
        
        <li class="item-card">
          <div>
            <h3>Tokyo, Japan</h3>
            <span class="badge badge-city-break">City Break</span>
          </div>
          <span class="status">Planned</span>
        </li>

        <li class="item-card done">
          <div>
            <h3>Santorini, Greece</h3>
            <span class="badge badge-plaja">Beach</span>
          </div>
          <span class="status">Visited</span>
        </li>

        <li class="item-card">
          <div>
            <h3>Banff National Park</h3>
            <span class="badge badge-munte">Mountain</span>
          </div>
          <span class="status">Planned</span>
        </li>

      </ul>
    </section>
  </main>

  <footer class="app-footer">Web Technologies Project</footer>
  <script src="destinations.js"></script>
</body>
</html>
